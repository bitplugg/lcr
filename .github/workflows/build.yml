name: Build LCR Recovery

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional, e.g. v1.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: twrp_lavender (LCR)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout LCR repo
        uses: actions/checkout@v4
        with:
          path: lcr

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-11-jdk unzip
          df -h

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "LCR CI"
          git config --global user.email "lcr@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync TWRP 14.1 minimal manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags
          df -h

      - name: Add LCR device tree, theme and scripts
        run: |
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p device/xiaomi
          cp -r "$GITHUB_WORKSPACE/lcr/device/xiaomi/lavender" device/xiaomi/lavender
          cp -r "$GITHUB_WORKSPACE/lcr/theme"   theme
          cp -r "$GITHUB_WORKSPACE/lcr/scripts" scripts
          ls -la device/xiaomi/lavender

      - name: Apply LCR theme and splash
        run: |
          cd "$GITHUB_WORKSPACE/android"
          python3 scripts/apply_theme.py bootable/recovery

      - name: Bundle Magisk into the recovery ramdisk
        run: |
          cd "$GITHUB_WORKSPACE/android"
          DEST=device/xiaomi/lavender/recovery/root/system/etc/lcr
          mkdir -p "$DEST"
          URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
                | grep -oE '"browser_download_url": *"[^"]+\.apk"' \
                | head -1 | cut -d'"' -f4)
          echo "Magisk package: $URL"
          if [ -n "$URL" ]; then
            curl -sL "$URL" -o "$DEST/Magisk.apk" || true
          fi
          ls -l "$DEST" || true

      - name: Build recovery image
        run: |
          cd "$GITHUB_WORKSPACE/android"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_lavender-ap2a-eng
          mka recoveryimage -j"$(nproc --all)"
          df -h

      - name: Locate and name the image
        id: artifact
        run: |
          cd "$GITHUB_WORKSPACE/android"
          IMG="$(ls -1 out/target/product/lavender/recovery.img)"
          cp "$IMG" "$GITHUB_WORKSPACE/lcr/recovery-LCR-lavender.img"
          sha256sum "$GITHUB_WORKSPACE/lcr/recovery-LCR-lavender.img" | tee "$GITHUB_WORKSPACE/lcr/recovery-LCR-lavender.img.sha256"
          echo "img=$GITHUB_WORKSPACE/lcr/recovery-LCR-lavender.img" >> "$GITHUB_OUTPUT"

      - name: Upload recovery image (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: recovery-LCR-lavender
          path: |
            lcr/recovery-LCR-lavender.img
            lcr/recovery-LCR-lavender.img.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LCR ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## LCR (Lavender Custom Recovery)
            Custom TWRP-based recovery for the Xiaomi Redmi Note 7 / Note 7S.

            - Devices: `lavender`, `lavenderin`
            - Base: TWRP `twrp-14.1` (Android 14)
            - Flash to the `recovery` partition:
              `fastboot flash recovery recovery-LCR-lavender.img`
            - If your device uses AVB, also disable verification:
              `fastboot --disable-verity --disable-verification flash vbmeta vbmeta.img`
          files: |
            lcr/recovery-LCR-lavender.img
            lcr/recovery-LCR-lavender.img.sha256
          fail_on_unmatched_files: true
